[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"enviroinsights/settings/*.py" = ["F403", "F405"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "enviroinsights.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires the real PostgreSQL, Redis and Celery Docker stack"]
filterwarnings = ["error::RuntimeWarning:django.db.models.fields"]
